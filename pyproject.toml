[project]
name = "adz"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.17.0",
    "httpx>=0.28.1",
    "observer>=0.1.0",
    # The factory's own browser, for the runtime proof screenshot. It
    # belongs here and not in a generated repo: screenshotting is a
    # gate's job, and no product should have to carry its inspector.
    # Needs `python -m playwright install chromium` once.
    "playwright>=1.63.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "uvicorn>=0.52.1",
    "watchdog>=6.0.0",
]

[tool.uv.workspace]
members = [
    "test",
]
